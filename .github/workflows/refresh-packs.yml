name: Refresh live packs

# Rebuilds the packs listed in tools/refresh-targets.json from their live sources, gates them, and
# commits them to the branch this ran on. It exists because the alternative is a human remembering to run
# tools/refresh.js twice a year, which is the kind of task that quietly stops happening.
#
# Cadence is per transfer window, not per day: a pack built mid-window is a half-finished squad list, and
# once a window shuts nothing changes until the next one opens. Two runs a year, plus `gh workflow run
# refresh-packs.yml` whenever you want one now. Note GitHub only fires schedules on the DEFAULT branch —
# on any other branch use the manual run button (or `--ref`) to exercise the same steps.
#
# What this can and cannot produce: club scaffolding (names, cities, stadiums, capacities, kit makers,
# managers) is copied, strength is derived from that season's points table, and players are left for the
# game to generate — no licenced source publishes ratings, so a pack that claimed to would be invented.
# Adding a country is one entry in tools/refresh-targets.json; it then appears in HUB → Universe because
# refresh.js keeps packs/manifest.js in step.
#
# Keep paid APIs out of here. A CI-committed pack is redistribution, and the free tiers (football-data.org,
# API-Football) licence their data for your app, not for republishing their database. Those keys belong on
# a player's own device, applied as an overlay in localStorage — see the note in refresh-targets.json.

on:
  schedule:
    - cron: '20 4 4 9 *' # 4 September, a few days after the European summer window shuts
    - cron: '20 4 4 2 *' # 4 February, a few days after the winter window shuts
  # GitHub registers schedules and the manual button only from the DEFAULT branch, so on a working branch
  # this job would be dead weight you cannot even smoke-test. Re-running on a change to the tooling itself
  # costs one short job and means a parser or target edit is proven against the live article immediately.
  # Paths are deliberately not `**`: refreshing must never fire on a gameplay commit, and a pack commit
  # carries [skip ci] so this cannot loop.
  push:
    paths:
      - '.github/workflows/refresh-packs.yml'
      - 'tools/refresh.js'
      - 'tools/refresh-run.js'
      - 'tools/refresh-targets.json'
  workflow_dispatch:
    inputs:
      targets:
        description: 'space-separated ids from tools/refresh-targets.json (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-live-packs

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The parser is the fragile half and Wikipedia is the thing that edits itself, so check it before it
      # writes anything. A markup change should fail here, not land as a league with six clubs missing.
      - name: Self-test the parser
        run: node tools/refresh.js --selftest

      - name: Rebuild each live pack
        run: node tools/refresh-run.js --dump=/tmp/refresh ${{ github.event.inputs.targets }}

      # Same gates a human runs: pack grammar + manifest, then the whole universe with packs merged in.
      - name: Gate
        run: |
          node tools/packs.js
          node tools/validate-db.js --with-packs

      - name: Upload what the parser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-dump
          path: /tmp/refresh
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit if any pack changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `git diff` cannot see an untracked file — and the first ever pack for a target is exactly that.
          # The debut run proved it: self-test, rebuild and gates all passed (so the live article parsed and
          # cleared the club floor), yet the step reported "nothing to commit" because no TRACKED path had
          # changed, and the pack it had just written was left in the runner's working copy. Ask git status,
          # which does include untracked paths.
          if ! git status --porcelain -- packs | grep -q .; then
            echo 'No pack changed since the last run — the article has not moved. Nothing to commit.'
            exit 0
          fi
          git add packs
          git commit -F - <<MSG
          packs: live refresh $(date -u +%F) [skip ci]

          Built by .github/workflows/refresh-packs.yml from Wikipedia season articles (CC BY-SA 4.0);
          attribution and the contributor history link are inside each pack's own note, and the fetched
          season is in its version. Strength is derived from that season's points table, not a rating.
          Players are generated by the game, because no licenced source publishes them.
          MSG
          git push origin "HEAD:${{ github.ref_name }}"
          echo 'Pushed. Refreshing a save: HUB → Universe → install the pack, then Universe Repair.'
